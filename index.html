  .purpose-box { background: linear-gradient(135deg, #fffbea, #fef3c7); border: 1.5px solid #fbbf24; border-radius: 12px; padding: 16px 18px; margin-bottom: 8px; color: #78350f; font-size: 0.88em; line-height: 1.85; white-space: pre-wrap; }

  .musttalk-list { counter-reset: mt-counter; }

  /* Slide cards */
  .slide-card { background: #fff; border: 1px solid #e2e8f0; border-radius: 10px; margin-bottom: 10px; overflow: hidden; }

        talk: "また、長期的に伸びていく事を見込んで仕込んでおくという方法も効果的です。\nその最たる例がこちらの表になるのですが、例えば左上にあるレーザーテックという会社は何の会社かご存知でしょうか？\n\nこの会社は日本を代表する半導体企業になります。\n仮にですが、○○さんが10年前に半導体のマーケットが伸びそうだからという理由でレーザーテック社の株を100万円購入していたと仮定して保有していた場合、100万→1億5千万になっているという計算になります。\n\nなので、世の中のお金落ちは個別株をやっている方が非常に多いのです。\n伸びそうな会社にお金を投資するだけで、その会社で働いている優秀な人達が勝手に業績を伸ばして株価を上げてくれるので、勝手にお金を増やしてくれるという構造だからです。\n\n結局、労働収入だけでは限界があるのは分かりきっていますからね。\n万が一、自分の体に何かあって倒れたら収入が0になりゲームオーバーですが、万が一に備えて労働収入以外の部分で収入を得れる構造を作り上げておく事によって、万が一の状況が起こった時にもお金の心配は生まれなくなりますからね。"

/* ========== MODAL RENDERING ========== */
function renderPillarModal(pillarNum) {
  const mClass = { 1: "m1", 2: "m2", 3: "m3", 4: "m4", 5: "m5" }[pillarNum];
  const titles = { 1: "① 世間話", 3: "② 危機感の醸成", 4: "③ プレゼン", 5: "④ クロージング" };
  const icons = { 1: "☕", 2: "📊", 3: "⚡", 4: "🎯", 5: "🔒" };
  const pillar = SCHOOL['pillar' + pillarNum];

  let html = `<div class="modal ${mClass}">
    <div class="modal-header">
      <button class="modal-close" onclick="closeModal()">×</button>
      <span class="head-badge">${icons[pillarNum]}</span>
      <h2>${titles[pillarNum]}</h2>
    </div>
    <div class="modal-body">`;

  // 目的
  if (pillar.purpose) {
    html += `<div class="section">
      <div class="section-title"><span>🎯</span>目的</div>
      <div class="purpose-box">${pillar.purpose}</div>
    </div>`;
  }

  // スライド
  if (pillar.slides) {
    html += `<div class="section"><div class="section-title"><span>🖼️</span>プレゼン資料（タップで展開）</div>`;
    pillar.slides.forEach((s, i) => {
      const inner = s.customHtml ? s.customHtml : `<div style="padding:20px;text-align:center;">${s.slideText || ''}</div>`;
      const talkHtml = s.talk.split('\n').map(p => p.trim()).filter(p => p).join('<br><br>');
      html += `<div class="slide-card" id="slide-${pillarNum}-${i}">
        <div class="slide-header" onclick="toggleSlide('slide-${pillarNum}-${i}')">
          <span class="slide-page">${s.page}</span>
          <span class="slide-title-text">${s.title}</span>
          <span class="slide-toggle">▼</span>
        </div>
        <div class="slide-body">
          <div class="slide-image">${inner}</div>
          <div class="slide-talk">${talkHtml}</div>
        </div>
      </div>`;
    });
    html += `</div>`;
  }

  // 絶対に使って欲しいトーク
  if (pillar.mustUseTalks) {
    html += `<div class="section"><div class="section-title"><span>💬</span>絶対に使って欲しいトーク</div><div class="musttalk-list">`;
    pillar.mustUseTalks.forEach(t => {
      html += `<div class="musttalk-card">
        <span class="mt-quote">「${t.text}」</span>
        <span class="mt-intent"><span class="mt-intent-label">意図 →</span>${t.intent}</span>
      </div>`;
    });
    html += `</div>`;
    if (pillar.tip) {
      html += `<div class="tip-box"><span class="tip-label">💡 ポイント</span>${pillar.tip}</div>`;
    }
    html += `</div>`;
  }

  // NG → OK トーク
  if (pillar.ngok) {
    html += `<div class="section"><div class="section-title"><span>⚖️</span>NG → OK トーク</div>`;
    pillar.ngok.forEach(n => {
      html += `<div class="ngok-row">
        <div class="situation">📌 ${n.sit}</div>
        <div class="ngok-card bad"><span class="tag-bad">❌ NG</span>${n.ng}</div>
        <div class="ngok-card good"><span class="tag-good">⭕ OK</span>${n.ok}</div>
      </div>`;
    });
    html += `</div>`;
  }

  // プレゼン：反論・数字
  if (pillarNum === 4) {
    if (pillar.objections) {
      html += `<div class="section"><div class="section-title"><span>🛡️</span>よくある反論・質問への切り返し</div>`;
      pillar.objections.forEach(o => {
        html += `<div class="objection-card"><div class="obj-q">${o.q}</div><div class="obj-a">${o.a}</div></div>`;
      });
      html += `</div>`;
    }
    if (pillar.numbers) {
      html += `<div class="section"><div class="section-title"><span>📊</span>スクールの重要数字</div><div class="number-grid">`;
      pillar.numbers.forEach(n => {
        html += `<div class="number-card"><div class="number-label">${n.label}</div><div class="number-big">${n.big}</div><div class="number-note">${n.note}</div></div>`;
      });
      html += `</div></div>`;
    }
  }

  // クロージング：断り文句
  if (pillarNum === 5 && pillar.objections) {
    html += `<div class="section"><div class="section-title"><span>🛡️</span>断り文句に対する解答例</div>`;
    pillar.objections.forEach(o => {
      const aHtml = o.a.split('\n').map(p => p.trim()).filter(p => p).join('<br><br>');
      html += `<div class="objection-card"><div class="obj-q">${o.q}</div><div class="obj-a">${aHtml}</div></div>`;
    });
    html += `</div>`;
  }

  html += `</div></div>`;
  return html;
}

function openModal(pillarKey) {
  const num = parseInt(pillarKey.replace('pillar', ''));
  document.getElementById('modalContent').innerHTML = renderPillarModal(num);
  document.getElementById('modalContainer').classList.add('active');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  document.getElementById('modalContainer').classList.remove('active');
  document.body.style.overflow = '';
}

function closeIfBackdrop(e) {
  if (e.target === document.getElementById('modalContainer')) closeModal();
}

function toggleSlide(slideId) {
  const card = document.getElementById(slideId);
  if (card) card.classList.toggle('open');
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
</script>
